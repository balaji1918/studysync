spring.application.name=StudySync

# ---- Database (values come from environment variables; see .env.example) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studysync?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:studysync}
spring.datasource.password=${DB_PASSWORD}

# ---- Flyway owns the schema. Hibernate must NOT create or change tables. ----
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Web / sessions ----
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true in production (HTTPS only)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.thymeleaf.cache=true

# ---- StudySync settings ----
# Public contact address shown on the Contact page. Leave empty until you have a real one.
studysync.contact-email=${CONTACT_EMAIL:}
