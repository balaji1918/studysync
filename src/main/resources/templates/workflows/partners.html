<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Find My Study Partner')}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}">
</div>
<div th:replace="~{fragments/layout :: flash}">
</div>
<main id="main" class="container">
<h1>Find My Study Partner</h1>
<p>
<a th:href="@{/profile}">Choose subjects you want to learn in your profile</a>. With no search, we match those subjects to classmates who can help.</p>
<a class="btn btn-outline" th:href="@{/study-requests}">My requests and sessions</a>
<form method="get" th:action="@{/partners}" class="card">
<label>Subject you find difficult<input name="subject" th:value="${subject}" maxlength="100">
</label>
<button class="btn btn-primary">Find classmates</button>
</form>
<p th:if="${partners.isEmpty()}">No matches yet. Update your learning subjects or search for another subject.</p>
<article class="card" th:each="p : ${partners}">
<h2>
<a th:href="@{/students/{id}(id=${p.user_id})}" th:text="${p.full_name}">
</a>
</h2>
<p th:text="${p.college}">
</p>
<p>Can help with <strong th:text="${p.subject_name}">
</strong>
</p>
<p th:text="${p.availability}">
</p>
<p th:text="${p.study_method}">
</p>
<form method="post" th:action="@{/partners/{id}/request(id=${p.user_id})}">
<input type="hidden" name="subject" th:value="${p.subject_name}">
<label>Introduce yourself and suggest what to study<textarea name="message" maxlength="500" required rows="4">
</textarea>
</label>
<button class="btn btn-primary">Request study session</button>
</form>
</article>
</main>
<div th:replace="~{fragments/layout :: footer}">
</div>
</body>
</html>
