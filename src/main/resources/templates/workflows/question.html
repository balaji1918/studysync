<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Question and answers')}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}">
</div>
<div th:replace="~{fragments/layout :: flash}">
</div>
<main id="main" class="container">
<h1>Question and answers</h1>
<a th:href="@{/questions}">Back to questions</a>
<article class="card">
<h2 th:text="${q.title}">
</h2>
<p>
<span th:text="${q.subject_name}">
</span> Â· <span th:text="${q.topic}">
</span> Â· <span th:text="${q.status}">
</span>
</p>
<p th:text="${q.full_name}">
</p>
<p class="user-content" th:text="${q.description}">
</p>
<form th:if="${q.author_id == me and q.status != 'RESOLVED' and !answers.isEmpty()}" method="post" th:action="@{/questions/{id}/resolve(id=${q.id})}">
<button class="btn btn-primary">Mark resolved</button>
</form>
</article>
<h2>Classmate explanations</h2>
<p th:if="${answers.isEmpty()}">No answers yet.</p>
<article class="card" th:each="a : ${answers}">
<h3 th:text="${a.full_name}">
</h3>
<p class="user-content" th:text="${a.body}">
</p>
<p>
<span th:text="${a.helpful}">
</span> students found this helpful</p>
<form th:if="${a.author_id != me and a.voted == 0}" method="post" th:action="@{/questions/{id}/helpful(id=${q.id})}">
<input type="hidden" name="answerId" th:value="${a.id}">
<button class="btn btn-outline">Mark helpful</button>
</form>
<p th:if="${a.voted > 0}">You marked this helpful.</p>
</article>
<section class="card">
<h2>Explain this doubt</h2>
<form method="post" th:action="@{/questions/{id}/answers(id=${q.id})}">
<label>Your explanation<textarea name="body" maxlength="10000" required rows="4">
</textarea>
</label>
<button class="btn btn-primary">Post answer</button>
</form>
</section>
</main>
<div th:replace="~{fragments/layout :: footer}">
</div>
</body>
</html>
