<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Explain My Doubt')}">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}">
</div>
<div th:replace="~{fragments/layout :: flash}">
</div>
<main id="main" class="container">
<h1>Explain My Doubt</h1>
<form method="get" th:action="@{/questions}" class="card">
<label>Subject<input name="subject" th:value="${subject}">
</label>
<label>Topic<input name="topic" th:value="${topic}">
</label>
<button class="btn btn-primary">Filter questions</button>
</form>
<h2>Questions</h2>
<p th:if="${questions.isEmpty()}">No questions found. Ask the first one below.</p>
<article class="card" th:each="q : ${questions}">
<h3>
<a th:href="@{/questions/{id}(id=${q.id})}" th:text="${q.title}">
</a>
</h3>
<p>
<span th:text="${q.subject_name}">
</span> Â· <span th:text="${q.topic}">
</span> Â· <span th:text="${q.status}">
</span>
</p>
<p th:text="${q.full_name}">
</p>
</article>
<section class="card">
<h2>Ask a question</h2>
<form method="post" th:action="@{/questions}">
<label>Subject<input name="subject" type="text" maxlength="100" required>
</label>
<label>Topic<input name="topic" type="text" maxlength="100" required>
</label>
<label>Question title<input name="title" type="text" maxlength="200" required>
</label>
<label>Describe your doubt (include code if helpful)<textarea name="description" maxlength="10000" required rows="4">
</textarea>
</label>
<button class="btn btn-primary">Post question</button>
</form>
</section>
</main>
<div th:replace="~{fragments/layout :: footer}">
</div>
</body>
</html>
